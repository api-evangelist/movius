aid: movius
name: Movius
description: >-
  Movius is a secure enterprise mobile communications company whose flagship
  product, MultiLine, gives employees a separate, compliant business identity
  (voice, SMS, MMS, and social messaging across WhatsApp, WeChat, Line, and
  Microsoft Teams) on their personal phones. Marketed as SCaaS (Secure
  Communication as a Service), the platform is built for regulated industries
  such as financial services, healthcare, and government, capturing and
  archiving all communications for FINRA, SEC, MiFID II, FCA COBS, HIPAA, and
  GDPR compliance. Movius exposes an admin/management REST API through its
  Management Portal that lets external applications provision and manage API
  users, assign and reassign numbers, configure compliance policies, and pull
  reports and communication records into cloud archival systems, alongside
  packaged integrations for Salesforce and Microsoft Teams.
