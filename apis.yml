apis:
- name: MultiLine Management REST API
  description: >-
    Admin/management REST API for MultiLine, used to connect external
    applications to a Movius organization. Supports provisioning and managing
    API users, assigning and reassigning business numbers, configuring
    compliance policies, and retrieving reports and archived communication
    records. Access is granted to API users created in the Management Portal;
    authentication is HTTP basic (username and password issued to the API user).
